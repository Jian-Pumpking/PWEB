<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="简彬博客文章详情页" />
    <title>Blog Post | 简彬 Jianbin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/post.css" />
  </head>
  <body>
    <div id="postApp" v-cloak>
      <header class="topbar">
        <a href="../index.html#home" class="brand">JIAN<span>BIN</span></a>
        <nav>
          <a href="../index.html#home">个人主页</a>
          <a href="../index.html#projects">个人作品</a>
          <a href="./index.html">个人博客</a>
        </nav>
      </header>

      <main class="post-main">
        <a class="back" href="./index.html">← Back to Blog</a>

        <article v-if="post" class="post-card">
          <p class="post-date">{{ formatDate(post.date) }}</p>
          <h1>{{ post.title }}</h1>
          <p class="post-summary">{{ post.summary }}</p>
          <img
            v-if="post.cover"
            class="post-cover"
            :src="post.cover"
            :alt="`${post.title} cover`"
          />
          <div class="tags">
            <span v-for="tag in post.tags" :key="tag">{{ tag }}</span>
          </div>
          <section class="gallery" v-if="post.gallery && post.gallery.length">
            <h3>Gallery / 图集</h3>
            <div class="gallery-grid">
              <img
                v-for="(img, idx) in post.gallery"
                :key="`${post.id}-g-${idx}`"
                :src="img"
                :alt="`${post.title} gallery ${idx + 1}`"
                loading="lazy"
              />
            </div>
          </section>
          <section class="post-content">
            <p v-for="(line, idx) in post.content" :key="idx">{{ line }}</p>
          </section>
        </article>

        <article v-else class="post-card">
          <h1>文章不存在 / Post Not Found</h1>
          <p class="post-summary">请检查链接参数，或返回博客列表重新选择文章。</p>
        </article>
      </main>
    </div>

    <script src="../assets/vendor/vue.global.prod.js"></script>
    <script src="../data/blogs.js"></script>
    <script src="../assets/js/post.js"></script>
  </body>
</html>
